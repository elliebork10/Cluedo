<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clue: Single Player Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Clue: Single Player Edition</h1>
    </header>

    <main class="game-container">
        <!-- Log of game actions -->
        <section id="game-log-container">
            <h2>Game Log</h2>
            <div id="game-log"></div>
        </section>

        <!-- Player controls and current hand -->
        <section id="player-dashboard">
            <div id="player-hand">
                <h2>Your Cards</h2>
                <ul id="hand-list"></ul>
            </div>

            <div id="detective-notebook">
                <h2>Detective Notebook</h2>
                <div id="notebook-grid">
                    <div class="notebook-header">
                        <span>Item</span>
                        <span>Hand / Shown</span>
                        <span>Maybe</span>
                        <span>Eliminated</span>
                    </div>
                    <div id="notebook-rows"></div>
            </div>

            <div id="action-controls">
                <h2>Your Turn</h2>
                <button id="end-turn-btn">End Turn / AI Turn</button>
                <button id="make-suggestion-btn">Make Suggestion</button>
                <button id="accuse-btn">Make Accusation</button>
            </div>
        </section>
    </main>

    <!-- Suggestion Pop-up Controls -->
    <div id="suggestion-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Make a Suggestion</h2>
            <label>Suspect: <select id="suspect-select"></select></label><br><br>
            <label>Weapon: <select id="weapon-select"></select></label><br><br>
            <label>Room: <select id="room-select"></select></label><br><br>
            <button id="submit-suggestion-btn">Submit Suggestion</button>
            <button id="cancel-suggestion-btn">Cancel</button>
        </div>
    </div>

    <!-- Accusation Pop-up Controls -->
    <div id="accusation-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Make a Final Accusation</h2>
            <p>Warning: An incorrect accusation will eliminate you from the game!</p>
            <label>Suspect: <select id="accuse-suspect-select"></select></label><br><br>
            <label>Weapon: <select id="accuse-weapon-select"></select></label><br><br>
            <label>Room: <select id="accuse-room-select"></select></label><br><br>
            <button id="submit-accusation-btn">Confirm Accusation</button>
            <button id="cancel-accusation-btn">Cancel</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
